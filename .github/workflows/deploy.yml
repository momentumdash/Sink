# Deploys Sink to Cloudflare Workers on every push to master.
#
# The Cloudflare token lives only in this repo's GitHub Actions secrets. It never
# touches a developer machine. Required secrets and variables are listed below.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # deploy:worker generates wrangler.deploy.jsonc from DEPLOY_*, applies D1
      # migrations, then uploads the Worker. Runtime secrets (NUXT_SITE_TOKEN and
      # friends) are managed in the Cloudflare dashboard; keep_vars in
      # wrangler.jsonc preserves them across deploys.
      - run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_D1_DATABASE_ID: ${{ vars.DEPLOY_D1_DATABASE_ID }}
          DEPLOY_KV_NAMESPACE_ID: ${{ vars.DEPLOY_KV_NAMESPACE_ID }}
          DEPLOY_D1_DATABASE_NAME: ${{ vars.DEPLOY_D1_DATABASE_NAME || 'sink' }}
